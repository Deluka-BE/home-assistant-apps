pid /tmp/nginx.pid;
events {}
http {
  # ES modules, stylesheets and SVG icons require their actual MIME types.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8099;
    allow 172.30.32.2;
    deny all;
    location = / { return 302 vnc.html?autoconnect=true&resize=remote&path=websockify; }
    location / { root /usr/share/novnc; }
    location /websockify {
      proxy_pass http://127.0.0.1:6080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location /mcp {
      proxy_pass http://127.0.0.1:8765;
      proxy_set_header Host localhost:8765;
      proxy_set_header Origin "";
      proxy_buffering off;
      proxy_read_timeout 180s;
    }
  }
}
