# Model HA's external prefix and Supervisor's prefix-stripped upstream requests.
# This runs at the Supervisor source IP (172.30.32.2); / is deliberately unrouted.
pid /tmp/ingress-proxy.pid;
events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    location / { return 404; }
    location /api/hassio_ingress/test-token_0123456789/ {
      proxy_pass http://172.30.32.3:8099/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Ingress-Path /api/hassio_ingress/test-token_0123456789;
      proxy_redirect off;
    }
    location /api/hassio_ingress/regression-token/ {
      proxy_pass http://172.30.32.3:8100/;
      proxy_redirect off;
    }
  }
}
