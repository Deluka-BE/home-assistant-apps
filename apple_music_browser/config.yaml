name: Apple Music Browser
version: "0.1.4"
slug: apple_music_browser
description: Persistent Apple Music browser with MCP playlist and library management
arch:
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:music
panel_title: Apple Music
audio: true
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Authenticated TLS Streamable HTTP MCP (enable in options)
map:
  - ssl:ro
options:
  mcp_enabled: false
  mcp_token: ""
  mcp_certfile: apple-music/fullchain.pem
  mcp_keyfile: apple-music/privkey.pem
schema:
  mcp_enabled: bool
  mcp_token: password
  mcp_certfile: str
  mcp_keyfile: str
url: https://github.com/Deluka-BE/home-assistant-apps/tree/main/apple_music_browser
image: ghcr.io/deluka-be/ha-apple-music-browser-{arch}
