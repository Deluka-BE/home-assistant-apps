name: Weather Camera PoC
version: "0.1.0"
slug: weather_camera_poc
description: Compare two CPU weather classifiers on one in-memory camera still
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
options:
  camera_entity: camera.woonkamer_vloeiend
  daylight_only: true
  interval_minutes: 60
  minimum_confidence: 0.65
schema:
  camera_entity: match(^camera\.[a-z0-9_]+$)
  daylight_only: bool
  interval_minutes: int(1,1440)
  minimum_confidence: float(0,1)
