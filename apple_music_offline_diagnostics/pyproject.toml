[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apple-music-rest-mcp"
version = "0.1.0"
description = "Offline in-memory MCP diagnostics for Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_music_mcp"]
