name: OpenHands Canvas ARM64 Alpha
on:
  push:
    branches: [main]
    paths: ['openhands_canvas/**', '.github/workflows/openhands-canvas-arm64.yaml']
  pull_request:
    paths: ['openhands_canvas/**', '.github/workflows/openhands-canvas-arm64.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openhands-canvas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registry login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
      - name: Preflight immutable release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/deluka-be/ha-openhands-canvas-aarch64:0.1.0-alpha.4
          if docker manifest inspect "$image" > /tmp/openhands-canvas-manifest 2>&1; then
            echo 'Refusing to overwrite existing release tag' >&2
            exit 1
          fi
          if ! grep -q 'manifest unknown' /tmp/openhands-canvas-manifest; then
            echo 'Cannot establish that release tag is absent; publication stopped' >&2
            exit 1
          fi
      - name: Build native ARM64 image
        run: >-
          docker build --platform linux/arm64
          --tag ghcr.io/deluka-be/ha-openhands-canvas-aarch64:0.1.0-alpha.4
          openhands_canvas
      - name: Push immutable release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/deluka-be/ha-openhands-canvas-aarch64:0.1.0-alpha.4
